name: starter

# The app's Postgres for development: `bun run db:up` starts it and `bun run db:down` stops it. The `pgdata` volume
# keeps the data; `docker compose down -v` removes it. Port 55432 avoids a local Postgres on 5432.
services:
  postgres:
    image: postgres:18
    ports:
      - '55432:5432'
    environment:
      POSTGRES_USER: protobase
      POSTGRES_PASSWORD: protobase
      POSTGRES_DB: scratch
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protobase -d scratch']
      interval: 2s
      timeout: 3s
      retries: 30
  # The calls' media server for development, only with the `calls` profile: `bun run calls:up` starts it. `--dev` gives
  # it the key `devkey` and the secret `secret` that .env.example names.
  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: [calls]
    command: --dev --bind 0.0.0.0
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

volumes:
  pgdata:
