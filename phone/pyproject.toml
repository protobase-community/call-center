[project]
name = "call-center-phone"
version = "0.1.0"
description = "The call center's phone side: the AI agent that answers each call, on LiveKit Agents"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "livekit-agents[openai]==1.8.8",
    "python-dotenv>=1.2.4",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/sip_call"]
testpaths = ["src", "tests"]
python_files = ["*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests/sip_call"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests/sip_call"]
venvPath = "."
venv = ".venv"
