name: protobase-bump

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: The Protobase release to move to; the latest on npm when empty.
        required: false

jobs:
  bump:
    # Only the template itself; an app created from it does not bump and merge on its own.
    if: github.repository_owner == 'protobase-community'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: protobase-community/.github/.github/workflows/protobase-bump.yml@main
    with:
      version: ${{ inputs.version }}
