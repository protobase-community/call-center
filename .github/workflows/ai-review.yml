# AI review of every pull request; see protobase-community/.github's ai-pr-review workflow. A review that finds no
# issues also merges the pull request once every other check passed, unless it carries the do-not-merge label. It can
# also be started by hand with workflow_dispatch and a pull request number. pull_request_target runs this file from
# the default branch and never checks out the pull request.
name: ai-review

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] nothing from the pull request runs
    # The review adds ai-approved with GITHUB_TOKEN, and a label added with GITHUB_TOKEN starts no workflow.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # The repository's CI workflows, by name: each run that finishes tries the merge again. Never list ai-review itself.
  workflow_run:
    workflows: [ci, phone]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: The pull request to review.
        required: true
        type: number

# Merging a pull request takes contents: write: https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps#repository-permissions-for-contents
permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  review:
    uses: protobase-community/.github/.github/workflows/ai-pr-review.yml@main # zizmor: ignore[unpinned-uses] main is the reviewed version
    with:
      # Only the template itself; an app created from it reviews without merging on its own.
      auto-merge: ${{ github.repository_owner == 'protobase-community' }}
      # A dispatched run's inputs arrive as text; the shared workflow's pr-number is a number.
      pr-number: ${{ fromJSON(inputs.pr-number || '0') }}
    secrets:
      SCW_PR_REVIEW_SECRET_KEY: ${{ secrets.SCW_PR_REVIEW_SECRET_KEY }}
